name: dudu_agent_core_test

services:
  dudu-agent-core:
    restart: always
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.server
    image: dudu-agent-core-test:v1.0
    container_name: dudu-agent-core-test
    env_file:
      - ${DUDU_COMPOSE_ENV_FILE:-.env}
    ports:
      - ${DUDU_SERVER_PORT:-32080}:8000
    volumes:
      - ${DUDU_DEPLOY_ROOT:-../data/test}/data:/app/data
      - ${DUDU_DEPLOY_ROOT:-../data/test}/logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0
